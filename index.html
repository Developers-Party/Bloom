<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="cgl-version" content="1.0.1">
<title>Welcome to CGL</title>
<link rel="icon" type="image/png" href="https://plain-enam-prod-public.komododecks.com/202608/14/RFwdodLRY6H5IKtxhe3f/image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="app">

  <aside class="rail">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 36 36">
        <path d="M10 24a5.5 5.5 0 01.6-10.96A7 7 0 0124.9 11 6 6 0 0126 22.9V23H10z" fill="#ff9d4d"/>
      </svg>
    </div>

    <nav>
      <a href="./" class="rail-btn active" title="Library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
      </a>
    </nav>

    <div class="rail-foot" title="Account">C</div>
  </aside>

  <div class="main">

    <div class="topbar">
      <a href="./" class="wordmark"><span class="dot"></span>CGL</a>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Search your library" autocomplete="off">
      </div>
    </div>

    <div class="crumb-row">
      <div class="crumb">Library</div>
      <div class="count" id="countEl">1 game</div>
    </div>

    <div class="stage">
      <div class="grid" id="libraryGrid">
        <!-- Each game is a real link to its own page: SITENAME/app/{id}/{slug}/ -->
        <a class="card" href="app/1/HalfLife/" data-name="Half-Life">
          <div class="card-art">
            <img src="https://plain-enam-prod-public.komododecks.com/202608/13/tVmuEFh7rT61mbyIMt5B/image.jpg" alt="Half-Life box art">
          </div>
          <div class="card-body">
            <div class="card-title">Half-Life</div>
            <div class="card-sub">Valve &middot; 1998</div>
          </div>
        </a>
        <!-- Add more games by adding another <a class="card"> block here,
             plus a new folder under /app/{id}/{slug}/index.html -->
      </div>
      <div class="no-results" id="noResults" hidden>No games match your search.</div>
    </div>

  </div>
</div>

<div class="update-toast" id="updateToast">
  <span class="dot-live" aria-hidden="true"></span>
  <span class="msg"><b>Update available.</b> Please wait, refreshing in <span id="updateCountdown">8</span>s&hellip;</span>
  <button id="updateNowBtn">Refresh now</button>
  <button class="dismiss" id="updateDismissBtn">Not now</button>
</div>

<script>
var searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', function(){
  var q = searchInput.value.trim().toLowerCase();
  var cards = document.querySelectorAll('.card');
  var visibleCount = 0;
  cards.forEach(function(card){
    var name = card.dataset.name.toLowerCase();
    var match = name.indexOf(q) !== -1;
    card.style.display = match ? '' : 'none';
    if(match) visibleCount++;
  });
  document.getElementById('noResults').hidden = visibleCount !== 0;
  document.getElementById('countEl').textContent = visibleCount + (visibleCount === 1 ? ' game' : ' games');
});
</script>
<script src="assets/update-check.js"></script>

</body>
</html>
